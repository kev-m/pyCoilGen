[pytest]
pythonpath = .
python_files = test_*.py regression_*.py
# The regression harness takes about a minute, so it is skipped by default. Run it with: pytest -m regression
# Run everything, as for a release, with: pytest -m ""
addopts = -m "not regression"
markers =
    regression: runs complete coil designs and compares them with golden values (slow, see tests/regression)
